<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwinePlayer performance workload</title>
<style>body{font:16px system-ui;margin:24px}#cards{display:grid;grid-template-columns:repeat(10,1fr);height:200px}.card{background:linear-gradient(45deg,#2563eb,#dc2626);margin:4px;transform:translateY(0)}.animate .card{animation:move 1s infinite alternate ease-in-out;filter:drop-shadow(2px 2px 4px #555)}@keyframes move{to{transform:translateY(50px) rotate(15deg);border-radius:30%}}canvas,video{width:320px;height:180px}#scroll{height:4000px;background:repeating-linear-gradient(#eee 0 100px,#ddd 100px 200px)}</style>
<h1>Authored performance fixture</h1><p>Identical idle, CSS animation, canvas, local video and scrolling workload for both players.</p><button id="counter" onclick="this.textContent=String(++window.clicks)">Activate</button><div id="cards"></div><canvas id="canvas" width="640" height="360"></canvas><video id="video" muted loop playsinline src="benchmark.mp4"></video><div id="scroll">Scrolling surface</div>
<script>
window.clicks=0;window.benchmarkCanvasFrames=0;for(let i=0;i<40;i++){const c=document.createElement('div');c.className='card';document.getElementById('cards').append(c);}
const canvas=document.getElementById('canvas'),context=canvas.getContext('2d'),video=document.getElementById('video');let draw=false;
function frame(t){if(!draw)return;window.benchmarkCanvasFrames++;{context.fillStyle='#101827';context.fillRect(0,0,640,360);for(let i=0;i<100;i++){context.fillStyle=`hsl(${i*3.6} 70% 50%)`;context.fillRect((i*17+t/7)%640,(i*29+t/15)%360,20,20);}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.benchmarkStage=async function(stage){document.body.classList.toggle('animate',stage==='css');draw=stage==='canvas';if(draw)requestAnimationFrame(frame);video.pause();if(stage==='video'){await video.play();}return {stage,videoWidth:video.videoWidth};};
</script></html>
