<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: file:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twine Player</title>
  <link rel="stylesheet" href="src/index.css">
</head>

<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <h1>Twine Player</h1>
      </div>
    </header>

    <main class="main-content">
      <section class="actions">
        <button id="load-game-btn" class="primary-btn glass-panel">
          <svg fill="none" class="icon" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Load Game
        </button>
      </section>

      <section class="history-section">
        <div class="history-header">
          <h2>
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Your Library
          </h2>
          <div class="library-controls">
            <input id="library-search" class="library-search" type="search" placeholder="Search library" autocomplete="off" aria-label="Search library">
            <select id="library-sort" class="library-sort" aria-label="Sort library">
              <option value="lastPlayed">Last played</option>
              <option value="title">Title</option>
              <option value="path">Path</option>
            </select>
          </div>
        </div>
        <div id="history-grid" class="history-grid">
          <!-- Items injected here -->
        </div>
      </section>
    </main>
  </div>
    <script src="src/storage-utils.js"></script>
    <script src="src/shared/library-history.js"></script>
    <script src="src/renderer.js"></script>
</body>

</html>
